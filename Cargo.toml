[workspace]
resolver = "2"
members = [
    "crates/triad-proto",
    "crates/triad-core",
    "crates/triad-sdk",
    "crates/triad-runner",
    "crates/triad-cli",
    "crates/triad-tui",
]

# ── Shared dependency versions ─────────────────────────────────────────────────
# Pin versions here; crates reference them with { workspace = true }

[workspace.package]
version      = "0.1.0"
edition      = "2024"
authors      = ["Triad Contributors"]
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/your-org/triad"
rust-version = "1.85"

[workspace.dependencies]

# ── Async runtime ──────────────────────────────────────────────────────────────
tokio            = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "signal", "macros"] }
tokio-stream     = { version = "0.1" }
futures          = { version = "0.3" }

# ── gRPC / HTTP ────────────────────────────────────────────────────────────────
tonic            = { version = "0.12", features = ["transport", "tls"] }
tonic-build      = { version = "0.12" }
prost            = { version = "0.13" }
prost-types      = { version = "0.13" }
axum             = { version = "0.7", features = ["macros"] }
tower            = { version = "0.4", features = ["full"] }
tower-http       = { version = "0.5", features = ["trace", "cors", "compression-gzip"] }
hyper            = { version = "1" }
reqwest          = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# ── CLI ────────────────────────────────────────────────────────────────────────
clap             = { version = "4", features = ["derive", "env"] }

# ── Kafka ──────────────────────────────────────────────────────────────────────
rdkafka          = { version = "0.36", features = ["cmake-build", "ssl", "sasl", "gssapi"] }
schema_registry_converter = { version = "4", features = ["easy", "avro"] }

# ── PostgreSQL ─────────────────────────────────────────────────────────────────
sqlx             = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
tokio-postgres   = { version = "0.7", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }

# ── Redis ──────────────────────────────────────────────────────────────────────
redis            = { version = "0.26", features = ["tokio-comp", "connection-manager", "cluster-async", "sentinel"] }
deadpool-redis   = { version = "0.16", features = ["cluster"] }
tokio-util       = { version = "0.7" }

# ── Serialization ──────────────────────────────────────────────────────────────
serde            = { version = "1", features = ["derive"] }
serde_json       = { version = "1" }
serde_yaml       = { version = "0.9" }
bytes            = { version = "1" }

# ── Configuration ──────────────────────────────────────────────────────────────
config           = { version = "0.14", features = ["yaml"] }

# ── Logging / Tracing ──────────────────────────────────────────────────────────
tracing                   = { version = "0.1" }
tracing-subscriber        = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-opentelemetry     = { version = "0.26" }

# ── OpenTelemetry ──────────────────────────────────────────────────────────────
opentelemetry                  = { version = "0.26" }
opentelemetry_sdk              = { version = "0.26", features = ["rt-tokio"] }
opentelemetry-otlp             = { version = "0.26", features = ["grpc-tonic", "trace", "metrics"] }
opentelemetry-semantic-conventions = { version = "0.26" }

# ── Metrics ────────────────────────────────────────────────────────────────────
metrics                        = { version = "0.23" }
metrics-exporter-prometheus    = { version = "0.15" }

# ── Error handling ─────────────────────────────────────────────────────────────
thiserror        = { version = "2" }
anyhow           = { version = "1" }

# ── Retry / backoff ────────────────────────────────────────────────────────────
backoff          = { version = "0.4", features = ["tokio"] }

# ── Utilities ──────────────────────────────────────────────────────────────────
uuid             = { version = "1", features = ["v4", "v7", "serde"] }
chrono           = { version = "0.4", features = ["serde"] }
async-trait      = { version = "0.1" }
dashmap          = { version = "6" }
hmac             = { version = "0.12" }
sha2             = { version = "0.10" }
hex              = { version = "0.4" }

# ── K8s leader election ────────────────────────────────────────────────────────
kube             = { version = "0.95", features = ["runtime", "derive", "rustls-tls"] }
k8s-openapi      = { version = "0.23", features = ["v1_31"] }

# ── Terminal UI ────────────────────────────────────────────────────────────────
crossterm        = { version = "0.28", features = ["event-stream"] }
ratatui          = { version = "0.28.1" }
tachyonfx        = { version = "0.7", features = ["sendable"] }

# ── Testing ────────────────────────────────────────────────────────────────────
mockall                = { version = "0.13" }
testcontainers         = { version = "0.23" }
testcontainers-modules = { version = "0.11", features = ["kafka", "postgres", "redis"] }
rstest                 = { version = "0.23" }
wiremock               = { version = "0.6" }
tokio-test             = { version = "0.4" }

# ── Benchmarking ───────────────────────────────────────────────────────────────
criterion              = { version = "0.5", features = ["html_reports"] }

# ── Property-based testing ────────────────────────────────────────────────────
proptest               = { version = "1" }

# ── Snapshot testing ──────────────────────────────────────────────────────────
insta                  = { version = "1", features = ["json"] }

# ── Async diagnostics (tokio-console) ─────────────────────────────────────────
console-subscriber     = { version = "0.4" }
