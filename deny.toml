# cargo-deny configuration for triad
# Run: cargo deny check
# Install: cargo install cargo-deny

[advisories]
# Deny crates with known security vulnerabilities from the RustSec advisory DB
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
version = 2
ignore = [
    # Add advisory IDs to ignore here, with justification comment, e.g.:
    # "RUSTSEC-2020-0071",  # time crate - only affects local time parsing, not used here
]

[licenses]
version = 2
# Allow common permissive and weak-copyleft licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "OpenSSL",
    "Zlib",
    "MPL-2.0",   # rdkafka / librdkafka transitive
]
# Deny GPL and LGPL (copyleft that would infect our library)
deny = [
    "GPL-2.0",
    "GPL-3.0",
    "LGPL-2.0",
    "LGPL-2.1",
    "LGPL-3.0",
    "AGPL-3.0",
]
# If a crate has no license, treat it as an error
unlicensed = "deny"
# Allow dual-licensed crates (MIT OR Apache-2.0 is the Rust standard)
allow-osi-fsf-free = "neither"

[bans]
# Deny duplicate versions of critical crates to catch diamond dependency issues
multiple-versions = "warn"  # start as warn; tighten to "deny" after audit
# Crates we explicitly don't want in the dependency tree
deny = [
    # Add banned crates here with reason, e.g.:
    # { name = "openssl", reason = "use rustls everywhere" },
]
# Skip specific duplicate-version pairs we can't avoid (e.g., transitive from rdkafka)
skip = []
skip-tree = []

[sources]
# Only allow crates from crates.io (no git or path dependencies in production)
unknown-registry = "deny"
unknown-git = "warn"   # warn during dev; tighten to "deny" before publishing
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
