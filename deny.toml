# cargo-deny configuration for triad  (cargo-deny 0.19+)
# Run: cargo deny check
# Install: cargo install cargo-deny

[advisories]
version = 2
ignore = [
    # backoff 0.4.0 — unmaintained; migrate to `backon` crate post-v0.1.0 (TRIAD-TODO)
    # No security vulnerability, only a maintenance advisory.
    "RUSTSEC-2025-0012",
    # instant 0.1.13 — unmaintained; transitive via backoff, no direct control.
    # Author recommends web-time; upgrade will follow backoff→backon migration.
    "RUSTSEC-2024-0384",
    # rustls-pemfile 2.2.0 — unmaintained; transitive via reqwest/tls, no direct control.
    # No safe upgrade available as of v0.1.0.
    "RUSTSEC-2025-0134",
    # tokio-tar 0.3.1 — tarmageddon vuln + unmaintained; dev-only via testcontainers.
    # Does NOT affect production builds (no testcontainers in [dependencies]).
    # Upgrade to astral-tokio-tar once testcontainers publishes a new release.
    "RUSTSEC-2025-0111",
    # paste 1.0.15 — unmaintained (author archived repo); transitive via ratatui→tachyonfx.
    # No safe upgrade: tachyonfx 0.7 pins ratatui 0.28.1 which pulls paste.
    # Re-evaluate when tachyonfx publishes a new release using an updated ratatui.
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
# Allow common permissive and weak-copyleft licenses; everything else is denied by default.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "OpenSSL",
    "Zlib",
    "MPL-2.0",          # rdkafka / librdkafka transitive
    "CC0-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",  # webpki-roots TLS trust store (data license, not code)
]
# Explicitly flag GPL/LGPL/AGPL as errors (copyleft that would infect our library)
exceptions = [
    # Example: { allow = ["GPL-2.0"], name = "some-crate", version = "*" }
]

[bans]
# Warn on duplicate crate versions to catch diamond dependency issues.
# Tighten to "deny" after the initial audit if desired.
multiple-versions = "warn"
wildcards         = "allow"    # allow * version specs in dev-dependencies
deny = [
    # Add banned crates with reason, e.g.:
    # { name = "openssl", reason = "use rustls everywhere" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git      = "warn"     # warn during dev; tighten to "deny" before publishing
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
allow-git        = []
