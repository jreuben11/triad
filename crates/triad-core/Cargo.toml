[package]
name           = "triad-core"
description    = "Core domain types, traits, error types, and config schema for Triad"
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

# cargo-machete: suppress pre-allocated and macro-driven deps
# Review in Phase 10 — some may be removable once OTel init moves to runner.
[package.metadata.cargo-machete]
ignored = [
    "bytes",               # pre-allocated for WAL ChangeEvent payload (Phase 10 CDC)
    "futures",             # StreamExt used in trait bounds; machete misses generic bounds
    "metrics",             # triad-core/src/metrics.rs defines name constants only; the
                           # `metrics` crate is needed so downstream crates can use the
                           # same registry without depending on it separately
    "opentelemetry",       # OTel context propagation types used in span wiring
    "opentelemetry-semantic-conventions", # semconv attribute constants
    "tokio-stream",        # Stream type bounds in Source trait (Phase 10)
    "tracing",             # info!/warn!/error! macros; machete misses macro-only usage
]

[dependencies]
# Async
tokio        = { workspace = true }
tokio-stream = { workspace = true }
tokio-util   = { version = "0.7" }
futures      = { workspace = true }
async-trait  = { workspace = true }

# Backend errors (type aliases used in error hierarchy)
sqlx         = { workspace = true }
redis        = { workspace = true }

# Serialization
serde        = { workspace = true }
serde_json   = { workspace = true }
serde_yaml   = { workspace = true }
bytes        = { workspace = true }

# Configuration
config       = { workspace = true }

# Error handling
thiserror    = { workspace = true }

# Metrics
metrics      = { workspace = true }

# Tracing
tracing      = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-semantic-conventions = { workspace = true }

# Utilities
uuid         = { workspace = true }
chrono       = { workspace = true }

[dev-dependencies]
mockall      = { workspace = true }
rstest       = { workspace = true }
tokio-test   = { workspace = true }
proptest     = { workspace = true }
