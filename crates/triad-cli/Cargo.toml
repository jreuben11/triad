[package]
name           = "triad-cli"
description    = "triad binary: standalone server (Mode 2) and admin CLI client"
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

# cargo-machete: suppress gRPC / future-phase deps
[package.metadata.cargo-machete]
ignored = [
    "chrono",          # timestamp formatting in status output (Phase 10 refactor)
    "config",          # TriadConfig loading in `triad server` subcommand
    "futures",         # async stream handling in command impls
    "serde_yaml",      # YAML config validation subcommand
    "tonic",           # gRPC admin client (Phase 10)
    "tracing",         # info!/warn! in command impls; machete misses macro-only usage
    "tracing-subscriber", # tracing init in main()
    "triad-proto",     # gRPC client stubs (Phase 10)
    "uuid",            # saga/checkpoint ID formatting in CLI output
]

[[bin]]
name = "triad"
path = "src/main.rs"

[dependencies]
triad-core   = { path = "../triad-core" }
triad-runner = { path = "../triad-runner" }
triad-proto  = { path = "../triad-proto" }

# Async
tokio       = { workspace = true }
tokio-util  = { workspace = true }
futures     = { workspace = true }

# CLI
clap        = { workspace = true }

# HTTP client (for admin-client commands)
reqwest     = { workspace = true }

# gRPC client
tonic       = { workspace = true }

# Serialization
serde       = { workspace = true }
serde_json  = { workspace = true }
serde_yaml  = { workspace = true }

# Config
config      = { workspace = true }

# Error handling
anyhow      = { workspace = true }

# Tracing
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

# Utilities
uuid    = { workspace = true }
chrono  = { workspace = true }

[features]
default    = []
kubernetes = ["triad-runner/kubernetes"]

[dev-dependencies]
rstest     = { workspace = true }
tokio-test = { workspace = true }
