[package]
name           = "triad-runner"
description    = "Pattern module implementations, backend clients, admin HTTP server, and leader election for Triad"
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

# cargo-machete: suppress false-positives and future-phase deps
# Remove this section in Phase 10 after wiring gRPC / OTel / refactoring.
[package.metadata.cargo-machete]
ignored = [
    "bytes",               # WAL parsing will use Bytes; pre-allocated for Phase 10 CDC work
    "console-subscriber",  # tokio-console support, wired via --features tokio-console
    "futures",             # StreamExt / FutureExt used in patterns; machete misses macro usage
    "hyper",               # low-level HTTP for future webhook / health optimisations
    "opentelemetry",       # OTel SDK init; wired in runner init path (Phase 10)
    "opentelemetry-otlp",  # OTLP exporter; wired in runner init path (Phase 10)
    "opentelemetry-semantic-conventions", # span attribute constants used in patterns
    "opentelemetry_sdk",   # OTel SDK setup in runner (Phase 10)
    "thiserror",           # used in pattern error types via derive macro; machete misses derives
    "tokio-stream",        # used in CDC WAL stream processing
    "tonic",               # gRPC admin service implementation (Phase 10)
    "tracing-opentelemetry", # bridges tracing spans to OTel (Phase 10 init)
    "triad-proto",         # gRPC service definitions (Phase 10)
]

[dependencies]
triad-core  = { path = "../triad-core" }
triad-proto = { path = "../triad-proto" }

# Async
tokio        = { workspace = true }
tokio-stream = { workspace = true }
tokio-util   = { workspace = true }
futures      = { workspace = true }
async-trait  = { workspace = true }

# gRPC / HTTP
tonic        = { workspace = true }
axum         = { workspace = true }
tower        = { workspace = true }
tower-http   = { workspace = true }
hyper        = { workspace = true }
reqwest      = { workspace = true }

# Kafka
rdkafka                   = { workspace = true }
schema_registry_converter = { workspace = true }

# PostgreSQL
sqlx                 = { workspace = true }
tokio-postgres       = { workspace = true }

# Redis
redis          = { workspace = true }
deadpool-redis = { workspace = true }

# Serialization
serde      = { workspace = true }
serde_json = { workspace = true }
bytes      = { workspace = true }

# Config
config     = { workspace = true }

# Error handling
thiserror  = { workspace = true }
anyhow     = { workspace = true }

# Retry
backoff    = { workspace = true }

# Tracing / Metrics
tracing                    = { workspace = true }
tracing-subscriber         = { workspace = true }
tracing-opentelemetry      = { workspace = true }
opentelemetry              = { workspace = true }
opentelemetry_sdk          = { workspace = true }
opentelemetry-otlp         = { workspace = true }
opentelemetry-semantic-conventions = { workspace = true }
metrics                    = { workspace = true }
metrics-exporter-prometheus = { workspace = true }

# Utilities
uuid    = { workspace = true }
chrono  = { workspace = true }
dashmap = { workspace = true }
hmac    = { workspace = true }
sha2    = { workspace = true }
hex     = { workspace = true }

# K8s leader election (optional: only compiled for Mode 3)
kube        = { workspace = true, optional = true }
k8s-openapi = { workspace = true, optional = true }

# Async task inspector (tokio-console) — optional, enable with --features tokio-console
console-subscriber = { workspace = true, optional = true }

[features]
default        = []
kubernetes     = ["kube", "k8s-openapi"]        # enables K8s Lease leader election
integration    = []                              # enables testcontainers integration tests
tokio-console  = ["console-subscriber"]         # enables tokio-console task inspector

