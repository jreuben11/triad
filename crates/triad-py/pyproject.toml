[build-system]
requires = ["maturin>=1,<2"]
build-backend = "maturin"

[project]
name = "triad"
version = "0.1.0"
description = "Python bindings for triad-sdk"
requires-python = ">=3.10"

[tool.maturin]
features = ["extension-module"]
python-source = "python"
module-name = "triad._triad"
manifest-path = "Cargo.toml"
cargo-extra-args = "--target-dir /tmp/triad-target-py"
